<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dist/login.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <title>
        Login Page
    </title>
</head>
<body>
   <main class="container mt-5">
    <div class = " row justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">
        <form id="login-forms" class="card p-4 shadow">

         <h2 class = "text-center mb-4"> Login </h2>

            <div class = "mb-3">
                <label for="username" class="form-label"> Username </label>
                <input type ="text" name = "username" id="username" class="form-control" required>
            </div>

            <div class = "mb-3">
                <label for = "password" class ="form-label">
                     Password 
                </label>
                <input type="password" name="password" id="password" class="form-control" required>
            </div>

            <button type="submit" id="login-button" class="btn btn-primary w-100">
                Login
            </button>
            <p id="mensagem" class="text-danger mt-3 text-center"></p>

            </p>
        </form>

    </div>

    </div>


   </main>
    






<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
<script type="module" src="dist/login.js" defer></script>


</body>
</html>
